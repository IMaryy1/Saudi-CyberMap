<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>الخريطة السيبرانية للمملكة</title>

<style>
body{
    margin:0;
    font-family: "Tahoma", sans-serif;
    background:#f5efe6;
    color:#3e2f1c;
    text-align:center;
}

h1{
    padding:20px;
}

.map-container{
    width:80%;
    margin:auto;
}

/* شكل المناطق */
svg path, svg circle{
    fill:#d6c2a1;
    stroke:#6b4f2a;
    stroke-width:2;
    cursor:pointer;
    transition:0.3s;
}

svg path:hover, svg circle:hover{
    fill:#b89a6a;
}

/* المودال */
.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.4);
    display:none;
    justify-content:center;
    align-items:center;
}

.modal-content{
    background:white;
    padding:25px;
    border-radius:12px;
    width:350px;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

button{
    background:#6b4f2a;
    color:white;
    border:none;
    padding:10px 18px;
    border-radius:8px;
    cursor:pointer;
}
</style>
</head>

<body>

<h1>الخريطة الرقمية للمملكة 🇸🇦</h1>
<p>اضغطي على المنطقة لاكتشاف التجربة السيبرانية</p>

<div class="map-container">

<!-- مبدئيًا نستخدم دوائر كمواقع المدن -->
<!-- لاحقًا نبدلها بخريطة SVG حقيقية -->

<svg viewBox="0 0 600 400" width="100%">

<!-- الرياض -->
<circle cx="300" cy="200" r="20" onclick="openModal('riyadh')"/>
<text x="300" y="240" text-anchor="middle">الرياض</text>

<!-- جدة -->
<circle cx="180" cy="220" r="18" onclick="openModal('jeddah')"/>
<text x="180" y="255" text-anchor="middle">جدة</text>

<!-- مكة -->
<circle cx="200" cy="180" r="16" onclick="openModal('makkah')"/>
<text x="200" y="160" text-anchor="middle">مكة</text>

<!-- المدينة -->
<circle cx="200" cy="120" r="16" onclick="openModal('madinah')"/>
<text x="200" y="100" text-anchor="middle">المدينة</text>

<!-- الشرقية -->
<circle cx="430" cy="210" r="20" onclick="openModal('sharqiyah')"/>
<text x="430" y="245" text-anchor="middle">الشرقية</text>

</svg>
</div>


<!-- المودال -->
<div class="modal" id="modal">
    <div class="modal-content">
        <h2 id="title"></h2>
        <p id="content"></p>
        <button onclick="closeModal()">إغلاق</button>
    </div>
</div>

<script>
const data = {
    riyadh:{
        title:"الرياض",
        text:"عاصمة الدولة الحديثة. التحدي: هل تستطيع تمييز رسالة تصيد؟"
    },
    jeddah:{
        title:"جدة",
        text:"بوابة التجارة للمملكة. التحدي: اختر الموقع الآمن للتسوق."
    },
    makkah:{
        title:"مكة المكرمة",
        text:"قلب العالم الإسلامي. التحدي: كيف تحمي حسابك من الاختراق؟"
    },
    madinah:{
        title:"المدينة المنورة",
        text:"مدينة التاريخ والرسالة. التحدي: اكتشف الرابط المزيف."
    },
    sharqiyah:{
        title:"المنطقة الشرقية",
        text:"مركز الطاقة والاقتصاد. التحدي: هل بياناتك محمية بكلمة مرور قوية؟"
    }
}

function openModal(city){
    document.getElementById("modal").style.display="flex";
    document.getElementById("title").innerText=data[city].title;
    document.getElementById("content").innerText=data[city].text;
}

function closeModal(){
    document.getElementById("modal").style.display="none";
}
</script>

</body>
</html>
